    <style>
        /* --- RESET GLOBALE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* --- VARIABILI COLORI --- */
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --accent: #8c00ff; 
            --accent-glow: rgba(140, 0, 255, 0.4);
            --whatsapp: #25D366;
            --whatsapp-glow: rgba(37, 211, 102, 0.4);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --google-blue: #4285F4;
            --google-orange: #FBBC05;
        }

        /* --- BASE --- */
        html { scroll-behavior: smooth; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }
        h1, h2, h3 { line-height: 1.2; }
        button { font-family: inherit; }

        /* --- ANIMAZIONI --- */
        .reveal {
            position: relative;
            transform: translateY(50px);
            opacity: 0;
            transition: all 1s ease;
        }

        .reveal.active {
            transform: translateY(0);
            opacity: 1;
        }

        /* --- NAVBAR --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 80px;
        }

        .logo { 
            font-size: 1.2rem; 
            font-weight: 800; 
            letter-spacing: 1px; 
            text-transform: uppercase;
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 15px; 
        }
        
        .logo img {
            height: 90px; 
            width: auto;
            margin-top: -20px;   
            margin-bottom: -20px; 
            display: block;
            object-fit: contain;
        }

        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        nav ul { display: flex; gap: 30px; }
        nav a { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover { color: var(--accent); text-shadow: 0 0 8px var(--accent); }

        .hamburger {
            display: none;
            cursor: pointer;
            z-index: 1001;
        }
        .bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px auto;
            transition: all 0.3s ease-in-out;
            background-color: white;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom, rgba(5,5,5,0.3), var(--bg-color)), 
                        linear-gradient(45deg, rgba(140,0,255,0.2), rgba(0,0,0,0.8)),
                        url('img/studio_back.jpg');
            background-size: cover;
            background-position: center;
            padding: 80px 20px 20px 20px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 5rem);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .hero h1 span {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }
        
        .hero p {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 40px auto; 
        }

        .btn-glow {
            padding: 15px 45px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 50px;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            text-align: center;
        }

        .btn-glow:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 40px var(--accent-glow);
            transform: scale(1.05);
        }

        .btn-whatsapp {
            border-color: var(--whatsapp);
            box-shadow: 0 0 15px var(--whatsapp-glow);
        }
        .btn-whatsapp:hover {
            background: var(--whatsapp);
            box-shadow: 0 0 40px var(--whatsapp-glow);
            color: #fff;
        }

        /* --- SEZIONE GENERALE --- */
        .section-padding { padding: 100px 5%; }
        .section-title { text-align: center; font-size: clamp(2rem, 4vw, 2.5rem); margin-bottom: 10px; }
        .section-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 40px; }

        /* --- ABOUT BOX --- */
        #about {
            background-color: #080808;
            border-bottom: 1px solid #222;
        }

        .about-box {
            max-width: 1000px;
            margin: 0 auto;
            background: linear-gradient(145deg, #111111, #0d0d0d);
            padding: 50px;
            border-left: 4px solid var(--accent);
            border-radius: 0 15px 15px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .about-img-wrapper {
            flex: 0 0 35%;
            max-width: 350px;
            position: relative;
        }

        .about-img-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid #333;
            filter: grayscale(20%); 
            transition: 0.3s;
        }
        
        .about-img-wrapper img:hover {
            filter: grayscale(0%);
            border-color: var(--accent);
        }

        .about-content { flex: 1; }

        .about-text {
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: justify;
        }

        .about-text:last-child { margin-bottom: 0; }
        .highlight { color: var(--accent); font-weight: bold; }

        /* --- DUAL PLAYER LAYOUT --- */
        .dual-player-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

      .player-container {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 40px;
            width: 100%; 
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            /* --- MODIFICA QUI --- */
            /* Prima era: justify-content: space-between; */
            /* Ora mettiamo flex-start per allinearli in alto in sequenza */
            justify-content: flex-start; 
            /* Aggiungiamo un gap opzionale per gestire meglio lo spazio se serve */
            gap: 20px; 
            /* -------------------- */
            height: 100%;
        }

        .player-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .track-title-display { 
            font-size: 1.3rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            text-align: center; 
            color: var(--accent); 
            
            /* --- MODIFICA PER ALLINEAMENTO --- */
            /* Altezza minima sufficiente per 2 righe (circa 3rem) */
            min-height: 3.2rem; 
            line-height: 1.2; /* Interlinea stretta per i titoli */
            
            /* Questo serve a centrare il testo verticalmente nello spazio riservato */
            display: flex;
            align-items: flex-end; /* Allinea in basso (più elegante per i titoli) o center */
            justify-content: center;
            /* --------------------------------- */
        }

        .track-description-display {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 25px; 
            font-style: italic;
            
            /* --- MODIFICA PER ALLINEAMENTO --- */
            /* Altezza minima per 2 righe abbondanti */
            min-height: 3rem; 
            line-height: 1.4;
            
            /* Centriamo il testo nel box se è corto */
            display: flex;
            align-items: flex-start; /* Allinea in alto */
            justify-content: center;
            /* --------------------------------- */
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .play-btn-large {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.2s, box-shadow 0.3s;
        }
        
        .play-btn-large:hover { box-shadow: 0 0 40px var(--accent-glow); }
        .play-btn-large:active { transform: scale(0.95); }
        .play-btn-large.playing { animation: pulse-border 2s infinite; }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(140, 0, 255, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(140, 0, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(140, 0, 255, 0); }
        }

        .ab-switch-container {
            display: flex;
            background: #000;
            border-radius: 30px;
            padding: 5px;
            border: 1px solid #333;
            flex-wrap: wrap;
            justify-content: center;
            
            /* --- MODIFICA AGGIUNTA --- */
            /* Impostiamo un'altezza fissa che accomodi bene i tasti */
            height: 54px; 
            box-sizing: border-box; /* Include bordi e padding nel calcolo */
            align-items: center;    /* Centra verticalmente i tasti nel box */
            /* ------------------------- */
        }

        .ghost-spacer {
            height: 54px; /* Stessa identica altezza del contenitore switch */
            width: 100%;
            display: block;
        }

        .switch-btn {
            padding: 8px 25px;
            border-radius: 25px;
            border: none;
            background: transparent;
            color: #888;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .switch-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .progress-bar {
            flex-grow: 1;
            -webkit-appearance: none;
            height: 5px;
            background: #333;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: -500px 0 0 492px var(--accent);
        }

        /* --- PLAYLIST --- */
        .playlist-container {
            margin-top: 20px;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        
        .playlist-header { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .playlist { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            max-height: 240px; 
            overflow-y: auto; 
            padding-right: 5px; 
            scrollbar-width: thin; 
            scrollbar-color: var(--accent) #1a1a1a;
        }

        .playlist::-webkit-scrollbar { width: 6px; }
        .playlist::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .playlist::-webkit-scrollbar-thumb { background-color: var(--accent); border-radius: 10px; border: 1px solid rgba(0,0,0,0.2); }
        .playlist::-webkit-scrollbar-thumb:hover { background-color: #a833ff; }

        .playlist-item {
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent;
            font-size: 0.95rem;
            flex-shrink: 0; 
        }
        
        .playlist-item:hover { background: rgba(255,255,255,0.08); }
        
        .playlist-item.active {
            border-color: var(--accent);
            background: rgba(140, 0, 255, 0.1);
        }
        
        .item-title { font-weight: 600; }

        /* --- SERVIZI --- */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-top: 50px;
        }

        .card {
            background: linear-gradient(145deg, #151515, #0a0a0a);
            padding: 40px 30px;
            border-radius: 15px;
            border: 1px solid #222;
            transition: 0.4s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(140, 0, 255, 0.1);
        }

        .card h3 { font-size: 1.8rem; margin-bottom: 15px; color: #fff; }
        .card p { color: #aaa; font-size: 0.95rem; line-height: 1.6; }
        .icon-box { font-size: 2rem; color: var(--accent); margin-bottom: 20px; }

        /* --- RECENSIONI --- */
        #reviews-grid {
            display: flex; 
            gap: 30px;
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            padding: 20px 0px; 
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; 
        }
        
        #reviews-grid::-webkit-scrollbar { display: none; } 

        .reviews-slider-wrapper {
            position: relative;
            max-width: 1200px; 
            margin: 0 auto;
            padding: 0 50px; 
        }

        .google-summary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 50px;
            display: inline-flex; 
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid #333;
        }
        .g-icon {
            width: 30px; height: 30px;
            background: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .g-icon svg { width: 18px; height: 18px; }
        .g-score { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .g-stars { color: var(--google-orange); letter-spacing: 2px; }

        .review-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 0 0 calc((100% - 60px) / 3); 
            scroll-snap-align: center; 
            position: relative;
        }
        
        .review-header { display: flex; align-items: center; gap: 15px; }
        
        .review-avatar {
            width: 40px; height: 40px;
            background: #333;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase; 
        }

        .review-author h4 { font-size: 1rem; margin: 0; }
        .review-author span { font-size: 0.8rem; color: #777; }
        
        .review-text { font-size: 0.95rem; color: #ccc; font-style: italic; }
        
        .card-g-icon {
            position: absolute;
            top: 20px; right: 20px;
            width: 20px; height: 20px;
            opacity: 0.5;
            fill: #fff; 
        }
