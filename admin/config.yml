backend:
  name: github
  repo: jbprojectstudio/jbprojectstudio # <--- Esempio: gboschetti/jb-project-site
  branch: main

media_folder: "img" # Dove verranno salvate le immagini caricate
public_folder: "/img"

collections:
  - name: "pagine"
    label: "Pagine"
    delete: false
    editor:
      preview: false
    files:
      - name: "home"
        label: "Contenuti Home Page"
        file: "data.json" # Il CMS salverà tutti i testi qui
        fields:
          # --- SEO E TESTATA ---
          - label: "SEO e Intestazione"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Titolo della Scheda Browser", name: "site_title", widget: "string" }
              - { label: "Descrizione per Google (Meta Tag)", name: "description", widget: "text" }

          # --- SEZIONE HERO (L'INIZIO) ---
          - label: "Sezione Hero (Inizio Page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titolo Principale (Usa <span> per il viola)", name: "title", widget: "string" }
              - { label: "Sottotitolo (Testo sotto il logo)", name: "subtitle", widget: "text" }
              - { label: "Testo del Bottone", name: "btn_text", widget: "string" }

          # --- SEZIONE VISIONE (ABOUT) ---
          - label: "Sezione Visione (About)"
            name: "about"
            widget: "object"
            fields:
              - { label: "Titolo Sezione", name: "title", widget: "string" }
              - { label: "Foto Profilo", name: "image", widget: "image" }
              - label: "Paragrafi di Testo"
                name: "paragraphs"
                widget: "list"
                summary: "{{fields.text}}"
                field: { label: "Testo del paragrafo", name: "text", widget: "text" }
              - { label: "Frase in Evidenza (Viola)", name: "highlight", widget: "string" }

          # --- PLAYER A/B ---
          - label: "Player A/B (Confronto Mix)"
            name: "ab_tracks"
            widget: "list"
            fields:
              - { label: "Titolo Brano", name: "title", widget: "string" }
              - { label: "Descrizione Sottotitolo", name: "description", widget: "string" }
              - { label: "File MASTER (Finito)", name: "master", widget: "file" }
              - { label: "File RAW (Originale)", name: "raw", widget: "file" }

          # --- PORTFOLIO LAVORI ---
          - label: "Lavori Finiti (Portfolio)"
            name: "portfolio_tracks"
            widget: "list"
            fields:
              - { label: "Titolo Brano", name: "title", widget: "string" }
              - { label: "Descrizione", name: "description", widget: "string" }
              - { label: "File Audio MP3", name: "src", widget: "file" }

          # --- SERVIZI ---
          - label: "I Miei Servizi"
            name: "services"
            widget: "list"
            max: 3
            fields:
              - { label: "Icona (Usa un'emoji tipo 🎹)", name: "icon", widget: "string" }
              - { label: "Nome Servizio", name: "title", widget: "string" }
              - { label: "Descrizione Servizio", name: "desc", widget: "text" }

          # --- RECENSIONI ---
          - label: "Recensioni Clienti"
            name: "reviews"
            widget: "list"
            fields:
              - { label: "Nome Artista", name: "name", widget: "string" }
              - { label: "Genere/Ruolo", name: "role", widget: "string" }
              - { label: "Testo della Recensione", name: "text", widget: "text" }

          # --- CONTATTI E SOCIAL ---
          - label: "Contatti e Social"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Numero WhatsApp (Solo cifre)", name: "whatsapp", widget: "string" }
              - { label: "Email di contatto", name: "email", widget: "string" }
              - { label: "Indirizzo Studio (Testo)", name: "address", widget: "text" }
              - { label: "Link Embed Google Maps (URL)", name: "map_link", widget: "string" }
